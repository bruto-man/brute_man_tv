<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BRUTE_MAN // SMARTBOX CINEMA 2D</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-void: #03060c;
      --bg-panel: #070e1a;
      --bg-card: #0b1628;
      --cyan: #00f2fe;
      --cyan-soft: rgba(0, 242, 254, 0.28);
      --orange: #f97316;
      --orange-glow: rgba(249, 115, 22, 0.45);
      --text-main: #f1f5f9;
      --text-dim: #94a3b8;
      --ease-2d: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-void);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .font-hud { font-family: 'Orbitron', 'JetBrains Mono', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    /* ===== FUNDO CYBER GRID 2D LEVE (SEM BLUR) ===== */
    .cinema-stage-bg {
      background-color: var(--bg-void);
      background-image:
        radial-gradient(circle at 50% 45%, rgba(0, 242, 254, 0.06) 0%, transparent 62%),
        linear-gradient(to right, rgba(0, 242, 254, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 242, 254, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
    }

    /* ===== ABERTURA ANIMADA CRT 2D (CLONE DA SMARTBOX) ===== */
    #hb-intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(ellipse at 50% 42%, #0b1a2e 0%, #040811 68%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      overflow: hidden;
      transition: opacity 0.45s var(--ease-2d), transform 0.45s var(--ease-2d);
    }
    #hb-intro.is-hidden {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }
    .intro-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 242, 254, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.06) 1px, transparent 1px);
      background-size: 38px 38px;
      animation: gridDrift2D 6s linear infinite;
    }
    .intro-tv {
      position: relative;
      width: 220px;
      height: 124px;
      border-radius: 16px;
      border: 2px solid var(--cyan);
      background: #02050a;
      box-shadow: 0 0 28px rgba(0, 242, 254, 0.4);
      animation: crtBoot2D 0.6s var(--ease-2d) both;
    }
    .intro-tv::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -13px;
      width: 68px;
      height: 4px;
      margin-left: -34px;
      border-radius: 4px;
      background: rgba(0, 242, 254, 0.55);
    }
    .intro-screen {
      position: absolute;
      inset: 6px;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0b1626, #050a14);
    }
    .intro-logo {
      font-weight: 900;
      font-size: 44px;
      color: #fb923c;
      letter-spacing: 0.06em;
      text-shadow: 0 0 18px rgba(249, 115, 22, 0.85);
      animation: logoPulse2D 1.3s ease-in-out infinite;
    }
    .intro-bars {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 12px;
      display: flex;
    }
    .intro-bars span { flex: 1; animation: barBlink2D 1s ease-in-out infinite; }
    .intro-bars span:nth-child(1) { background: #f8fafc; }
    .intro-bars span:nth-child(2) { background: #facc15; animation-delay: .1s; }
    .intro-bars span:nth-child(3) { background: #00f2fe; animation-delay: .2s; }
    .intro-bars span:nth-child(4) { background: #22c55e; animation-delay: .3s; }
    .intro-bars span:nth-child(5) { background: #a78bfa; animation-delay: .4s; }
    .intro-bars span:nth-child(6) { background: #f97316; animation-delay: .5s; }
    .intro-bars span:nth-child(7) { background: #3b82f6; animation-delay: .6s; }
    .intro-scan {
      position: absolute;
      left: 0; right: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.35);
      animation: scanY2D 1.6s linear infinite;
    }
    .intro-load {
      width: 200px;
      height: 4px;
      border-radius: 4px;
      background: rgba(148, 163, 184, 0.2);
      overflow: hidden;
    }
    .intro-load span {
      display: block;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, var(--orange), var(--cyan));
      animation: loadSlide2D 1.1s ease-in-out infinite;
    }

    @keyframes crtBoot2D {
      0% { transform: scale(0.04, 0.02); opacity: 0; }
      45% { transform: scale(1, 0.03); opacity: 1; }
      100% { transform: scale(1, 1); opacity: 1; }
    }
    @keyframes logoPulse2D {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes barBlink2D {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes scanY2D {
      0% { transform: translateY(-60px); }
      100% { transform: translateY(60px); }
    }
    @keyframes loadSlide2D {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
    @keyframes gridDrift2D {
      0% { background-position: 0 0; }
      100% { background-position: 0 38px; }
    }

    /* ===== ESTRUTURA PRINCIPAL 2D ===== */
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 14px;
      position: relative;
    }

    /* TOPO HUD 2D */
    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0, 242, 254, 0.18);
      z-index: 20;
      transition: transform 0.35s var(--ease-2d), opacity 0.35s var(--ease-2d);
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(249, 115, 22, 0.22);
      border: 1px solid var(--orange);
      color: #fb923c;
      font-weight: 900;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.35);
    }
    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, #fb923c, #fde047, #67e8f9);
      -webkit-background-clip: text;
      color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .chip-pill {
      padding: 5px 10px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--cyan-soft);
      color: #67e8f9;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }
    .chip-pill:hover {
      border-color: var(--cyan);
      background: rgba(0, 242, 254, 0.12);
    }
    .chip-pill:active { transform: scale(0.96); }
    .chip-pill.orange {
      border-color: rgba(249, 115, 22, 0.55);
      color: #fdba74;
    }
    .chip-pill.orange:hover {
      border-color: var(--orange);
      background: rgba(249, 115, 22, 0.16);
    }

    /* ===== PALCO CENTRAL 2D DE CINEMA ===== */
    .stage-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      position: relative;
    }

    .tv-frame-2d {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: min(76vw, calc((100vh - 175px) * (16 / 9)));
      max-height: calc(100vh - 175px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      border: 1px solid rgba(0, 242, 254, 0.42);
      box-shadow: 0 0 36px rgba(0, 242, 254, 0.14);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: max-width 0.38s var(--ease-2d), max-height 0.38s var(--ease-2d), transform 0.35s var(--ease-2d), box-shadow 0.35s var(--ease-2d);
    }
    .tv-frame-2d.zoom-1 {
      max-width: min(86vw, calc((100vh - 142px) * (16 / 9)));
      max-height: calc(100vh - 142px);
    }
    .tv-frame-2d.zoom-2 {
      max-width: min(92vw, calc((100vh - 96px) * (16 / 9)));
      max-height: calc(100vh - 96px);
      border-radius: 12px;
    }

    /* Animação 2D de Zapping ao trocar de filme */
    .tv-frame-2d.is-zapping {
      animation: tvZap2D 0.32s var(--ease-2d);
    }
    @keyframes tvZap2D {
      0% { transform: scale(0.985); filter: brightness(1.35); }
      50% { transform: scale(1.004); filter: brightness(1.1); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    /* Circuito Elétrico Neon 2D percorrendo a moldura */
    .tv-circuit-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }
    .tv-circuit-line {
      fill: none;
      stroke: url(#neon2DGrad);
      stroke-width: 2.5;
      stroke-dasharray: 420 2400;
      animation: circuitRun2D 9s linear infinite;
    }
    @keyframes circuitRun2D {
      0% { stroke-dashoffset: 2820; opacity: 0; }
      8% { opacity: 0.95; }
      35% { stroke-dashoffset: 0; opacity: 0.95; }
      42% { opacity: 0; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* Pausa a animação decorativa durante o filme para 0% de overhead na GPU */
    body.cinema-idle .tv-circuit-line {
      animation-play-state: paused;
      opacity: 0 !important;
    }

    /* Cantoneiras HUD 2D */
    .hud-corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--cyan);
      border-style: solid;
      pointer-events: none;
      z-index: 14;
      opacity: 0.75;
    }
    .hud-corner.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; border-top-left-radius: 4px; }
    .hud-corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; border-top-right-radius: 4px; }
    .hud-corner.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; border-bottom-left-radius: 4px; }
    .hud-corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; border-bottom-right-radius: 4px; }

    /* Barra interna superior da TV (Título do Filme) */
    .tv-inner-top {
      height: 30px;
      padding: 0 14px;
      background: rgba(3, 6, 12, 0.88);
      border-bottom: 1px solid rgba(0, 242, 254, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      z-index: 12;
      flex-shrink: 0;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--orange);
      display: inline-block;
      margin-right: 8px;
      animation: pulseDot2D 1.8s ease-in-out infinite;
    }
    @keyframes pulseDot2D {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.82); }
    }

    /* Área de Vídeo Pura */
    .screen-viewport {
      flex: 1;
      min-height: 0;
      width: 100%;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .screen-viewport video,
    .screen-viewport iframe,
    .screen-viewport .yt-box {
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: contain;
      background: #000;
    }
    .screen-viewport img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Flash 2D de troca de canal */
    .zap-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent 0%, rgba(0, 242, 254, 0.22) 50%, transparent 100%);
      opacity: 0;
      transform: translateX(-100%);
      z-index: 13;
    }
    .zap-overlay.run {
      animation: zapSweep2D 0.34s var(--ease-2d);
    }
    @keyframes zapSweep2D {
      0% { opacity: 0.9; transform: translateX(-100%); }
      100% { opacity: 0; transform: translateX(100%); }
    }

    /* ===== DOCK MINIMALISTA: APENAS RETORNA, PLAY, AVANÇA E VOLUME ===== */
    .cinema-dock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 6px 12px 2px;
      z-index: 20;
      transition: transform 0.35s var(--ease-2d), opacity 0.35s var(--ease-2d);
    }

    .dock-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-panel);
      border: 1px solid rgba(0, 242, 254, 0.32);
      padding: 6px 14px;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65);
    }

    .ctrl-btn {
      height: 40px;
      padding: 0 14px;
      border-radius: 11px;
      border: 1px solid rgba(0, 242, 254, 0.3);
      background: var(--bg-card);
      color: var(--text-main);
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.14s var(--ease-2d), border-color 0.18s, background 0.18s;
    }
    .ctrl-btn:hover {
      border-color: var(--cyan);
      background: rgba(0, 242, 254, 0.12);
    }
    .ctrl-btn:active { transform: scale(0.95); }

    .ctrl-btn.primary {
      min-width: 112px;
      border-color: var(--orange);
      background: rgba(249, 115, 22, 0.22);
      color: #fdba74;
      box-shadow: 0 0 16px rgba(249, 115, 22, 0.25);
    }
    .ctrl-btn.primary:hover {
      background: rgba(249, 115, 22, 0.35);
      border-color: #fb923c;
    }

    .vol-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 6px;
      border-left: 1px solid rgba(148, 163, 184, 0.22);
    }
    .vol-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid rgba(0, 242, 254, 0.3);
      background: var(--bg-card);
      color: #67e8f9;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
    }
    .vol-btn.muted {
      border-color: rgba(239, 68, 68, 0.6);
      color: #fca5a5;
    }
    .vol-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 86px;
      height: 5px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.28);
      outline: none;
      cursor: pointer;
    }
    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cyan);
      border: 2px solid #03060c;
      cursor: pointer;
    }
    .vol-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cyan);
      border: 2px solid #03060c;
      cursor: pointer;
    }
    .vol-pct {
      font-size: 10px;
      color: var(--text-dim);
      width: 32px;
      text-align: right;
    }

    /* ===== AUTO-HIDE MODO CINEMA (QUANDO O FILME ESTÁ RODANDO) ===== */
    body.cinema-idle .hud-top {
      opacity: 0;
      transform: translateY(-100%);
      pointer-events: none;
    }
    body.cinema-idle .cinema-dock {
      opacity: 0;
      transform: translateY(100%);
      pointer-events: none;
    }
    body.cinema-idle .tv-frame-2d.zoom-2 {
      max-width: 94vw;
      max-height: 92vh;
    }

    /* ===== GAVETA 2D DE CANAIS & FILMES (DESLIZA SEM BLUR) ===== */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 5, 10, 0.72);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s var(--ease-2d);
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer-2d {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 360px;
      max-width: 90vw;
      background: var(--bg-panel);
      border-left: 1px solid rgba(0, 242, 254, 0.35);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateX(102%);
      transition: transform 0.3s var(--ease-2d);
    }
    .drawer-2d.open {
      transform: translateX(0);
    }
    .drawer-head {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(0, 242, 254, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ch-group-title {
      font-size: 11px;
      font-weight: 800;
      color: #fb923c;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .movie-item {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      transition: border-color 0.18s, background 0.18s;
    }
    .movie-item:hover {
      border-color: var(--cyan);
    }
    .movie-item.active {
      border-color: var(--orange);
      background: rgba(249, 115, 22, 0.14);
      color: #fdba74;
    }

    /* ===== RESPONSIVO CELULAR ===== */
    @media (max-width: 680px) {
      #app { padding: 8px; }
      .brand-sub { display: none; }
      .brand-title { font-size: 11px; }
      .tv-frame-2d,
      .tv-frame-2d.zoom-1,
      .tv-frame-2d.zoom-2 {
        max-width: 100%;
        max-height: calc(100dvh - 130px);
        border-radius: 12px;
      }
      .dock-bar {
        width: 100%;
        justify-content: space-between;
        padding: 6px 8px;
        gap: 6px;
      }
      .ctrl-btn {
        height: 42px;
        padding: 0 10px;
        font-size: 10px;
      }
      .ctrl-btn.primary { min-width: 88px; }
      .vol-slider { width: 58px; }
      .vol-pct { display: none; }
    }
  </style>
</head>
<body class="cinema-stage-bg">

  <!-- ABERTURA CRT 2D -->
  <div id="hb-intro">
    <div class="intro-grid"></div>
    <div class="intro-tv">
      <div class="intro-screen">
        <div class="intro-logo font-hud">HB</div>
        <div class="intro-bars">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="intro-scan"></div>
      </div>
    </div>
    <div style="text-align:center; z-index:2;">
      <div class="font-hud" style="font-size:22px; font-weight:800; color:#fb923c; letter-spacing:0.12em;">HOMEM BRUTO</div>
      <div id="intro-status" class="font-mono" style="margin-top:8px; font-size:11px; color:#67e8f9; letter-spacing:0.16em;">CINEMA 2D // SINTONIZANDO...</div>
    </div>
    <div class="intro-load"><span></span></div>
  </div>

  <!-- PALCO PRINCIPAL -->
  <div id="app">
    <!-- TOPO MINIMALISTA -->
    <header class="hud-top">
      <div class="brand-box">
        <div class="brand-badge font-hud">HB</div>
        <div style="min-width:0;">
          <div class="brand-title font-hud">HOMEM BRUTO // CINEMA 2D</div>
          <div class="brand-sub font-mono" id="hud-channel-info">MODO ULTRA-LEVE • 60 FPS</div>
        </div>
      </div>

      <div class="top-actions font-mono">
        <span class="chip-pill" id="hud-counter">1 / 1</span>
        <button type="button" class="chip-pill" id="btn-zoom" title="Alternar Nível de Expansão (Z)">⤢ TELA: PADRÃO</button>

    <!-- TELA DA TV 2D -->
    <main class="stage-wrap" id="stage-wrap">
      <div class="tv-frame-2d" id="tv-frame">

    <!-- DOCK DE CONTROLES: APENAS RETORNA, PLAY, AVANÇA E VOLUME -->
    <footer class="cinema-dock">
      <div class="dock-bar">
        <button type="button" class="ctrl-btn" id="btn-prev" title="Retorna (Seta Esquerda)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><rect x="5" y="4" width="2.5" height="16" rx="1"></rect></svg>

        </button>

        <button type="button" class="ctrl-btn primary" id="btn-play" title="Play / Pause (Espaço)">
          <span id="play-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>

          <span id="play-label">PLAY</span>

        <button type="button" class="ctrl-btn" id="btn-next" title="Avança (Seta Direita)">
          <span>AVANÇA</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><rect x="16.5" y="4" width="2.5" height="16" rx="1"></rect></svg>
        </button>

        <div class="vol-group">
          <button type="button" class="vol-btn" id="btn-mute" title="Mudo / Som (M)" aria-label="Volume">
            <svg id="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
          </button>
          <input type="range" class="vol-slider" id="vol-slider" min="0" max="100" value="80" aria-label="Nível de volume" />
          <span class="vol-pct font-mono" id="vol-pct">80%</span>
        </div>
      </div>

  </div>

  <!-- GAVETA DE SELEÇÃO DE FILMES / CANAIS -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer-2d" id="drawer-2d" aria-label="Lista de Filmes e Canais">
    <div class="drawer-head">
      <div>
        <div class="font-hud" style="font-size:13px; font-weight:800; color:#fb923c;">CATÁLOGO CINEMA 2D</div>
        <div class="font-mono" style="font-size:10px; color:#94a3b8;" id="drawer-total">0 TÍTULOS</div>
      </div>
      <button type="button" class="chip-pill orange" id="btn-close-drawer">✕ FECHAR</button>
    </div>
    <div class="drawer-body hud-scroll" id="drawer-body"></div>
  </aside>

  <script>
    (function () {
      const DATA_URL = "./";

      // Catálogo de reserva caso o arquivo seja aberto localmente sem canais.json
      const FALLBACK_CHANNELS = [
        {
          id: "CH_DEMO_CINEMA",
          slug: "sessao-cinema",
          title: "SESSÃO CINEMA 2D",
          badge: "FULL HD",
          videos: [
            { label: "Demonstração 1: Robô Dançante (MP4)", url: "https://assets.mixkit.co/videos/preview/mixkit-little-robot-dancing-happily-43407-large.mp4" },
            { label: "Demonstração 2: Horizonte Solar (MP4)", url: "https://assets.mixkit.co/videos/preview/mixkit-set-of-plateaus-seen-from-the-sky-in-a-sunset-26070-large.mp4" }
          ]
        }
      ];

      // Estado Central Ultra-Leve
      const state = {
        channels: [],
        playlist: [], // Lista linear unificada [{ ci, ii, chTitle, label, url }]
        pos: 0,
        playing: true,
        muted: false,
        volume: 80,
        ytPlayer: null,
        htmlVideo: null,
        idleTimer: null,
        zoomLevel: 0 // 0 = Padrão, 1 = +50% Expansão, 2 = 90% Cinema (10% margem)
      };

      // Referências DOM cacheadas (Zero re-renderização de árvore)
      const el = {
        intro: document.getElementById("hb-intro"),
        introStatus: document.getElementById("intro-status"),
        hudInfo: document.getElementById("hud-channel-info"),
        hudCounter: document.getElementById("hud-counter"),
        tvFrame: document.getElementById("tv-frame"),
        tvNowPlaying: document.getElementById("tv-now-playing"),
        tvBadge: document.getElementById("tv-badge"),
        viewport: document.getElementById("screen-viewport"),
        zapOverlay: document.getElementById("zap-overlay"),
        btnPrev: document.getElementById("btn-prev"),
        btnPlay: document.getElementById("btn-play"),
        playIcon: document.getElementById("play-icon"),
        playLabel: document.getElementById("play-label"),
        btnNext: document.getElementById("btn-next"),
        btnMute: document.getElementById("btn-mute"),
        volIcon: document.getElementById("vol-icon"),
        volSlider: document.getElementById("vol-slider"),
        volPct: document.getElementById("vol-pct"),
        btnZoom: document.getElementById("btn-zoom"),
        btnFullscreen: document.getElementById("btn-fullscreen"),
        btnOpenDrawer: document.getElementById("btn-open-drawer"),
        btnCloseDrawer: document.getElementById("btn-close-drawer"),
        drawerBackdrop: document.getElementById("drawer-backdrop"),
        drawer: document.getElementById("drawer-2d"),
        drawerBody: document.getElementById("drawer-body"),
        drawerTotal: document.getElementById("drawer-total")
      };

      // Som Sintetizado Holo 2D (WebAudio leve, sem arquivos externos)
      let audioCtx = null;
      function playHoloBeep(type) {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          const now = audioCtx.currentTime;
          if (type === "swap") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(380, now);
            osc.frequency.exponentialRampToValueAtTime(1120, now + 0.14);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.start(now);
            osc.stop(now + 0.16);
          } else {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(820, now);
            osc.frequency.exponentialRampToValueAtTime(440, now + 0.06);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
            osc.start(now);
            osc.stop(now + 0.07);
          }
        } catch (e) {}
      }

      // Parser OmniLink (YouTube, Drive, MP4, Imagem, Web)
      function parseMediaLink(rawUrl) {
        if (!rawUrl) return { type: "UNKNOWN", url: "", badge: "STREAM" };
        let url = String(rawUrl).trim();
        const iframeMatch = url.match(/src=["'](.*?)["']/);
        if (iframeMatch) url = iframeMatch[1];

        if (/youtube\.com|youtu\.be/i.test(url)) {
          let id = "";
          const m = url.match(/youtu\.be\/([\w-]{6,})/) || url.match(/[?&]v=([\w-]{6,})/) || url.match(/\/(?:shorts|embed)\/([\w-]{6,})/);
          if (m) id = m[1];
          return {
            type: "YOUTUBE",
            ytId: id,
            url: url,
            badge: url.includes("/shorts/") ? "SHORTS 2D" : "YOUTUBE HD"
          };
        }

        if (url.includes("drive.google.com")) {
          let driveUrl = url;
          if (url.includes("/view")) driveUrl = url.replace(/\/view.*/, "/preview");
          else if (!url.includes("/preview")) driveUrl = url.replace(/\/edit.*/, "/preview");
          return { type: "DRIVE", url: driveUrl, badge: "GOOGLE DRIVE" };
        }

        if (/^data:video\//i.test(url) || url.startsWith("blob:") || /\.(mp4|webm|ogg|mov)($|\?)/i.test(url) || url.includes("mixkit.co") || url.includes("pub-")) {
          return { type: "VIDEO", url: url, badge: "CINEMA MP4" };
        }

        if (/^data:image\//i.test(url) || /\.(png|jpe?g|webp|gif|svg)($|\?)/i.test(url)) {
          return { type: "IMAGE", url: url, badge: "IMAGEM HD" };
        }

        return { type: "IFRAME", url: url, badge: "PORTAL WEB" };
      }

      // Loader sob demanda da API do YouTube
      let ytApiPromise = null;
      function ensureYTApi() {
        if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
        if (!ytApiPromise) {
          ytApiPromise = new Promise((resolve) => {
            const prev = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = () => {
              if (prev) prev();
              resolve(window.YT);
            };
            const tag = document.createElement("script");
            tag.src = "https://www.youtube.com/iframe_api";
            document.head.appendChild(tag);
          });
        }
        return ytApiPromise;
      }

      // Limpeza rigorosa da mídia anterior para consumo zero de RAM
      function destroyCurrentMedia() {
        if (state.ytPlayer) {
          try { state.ytPlayer.destroy(); } catch (e) {}
          state.ytPlayer = null;
        }
        if (state.htmlVideo) {
          try {
            state.htmlVideo.pause();
            state.htmlVideo.removeAttribute("src");
            state.htmlVideo.load();
          } catch (e) {}
          state.htmlVideo = null;
        }
        el.viewport.innerHTML = "";
      }

      // Dispara efeito visual 2D de zapping
      function triggerZap2D() {
        el.tvFrame.classList.remove("is-zapping");
        el.zapOverlay.classList.remove("run");
        void el.tvFrame.offsetWidth; // Reflow mínimo para reiniciar keyframe 2D
        el.tvFrame.classList.add("is-zapping");
        el.zapOverlay.classList.add("run");
      }

      // Atualiza visual dos botões Play e Volume
      function syncControlsUI() {
        if (state.playing) {
          el.playIcon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>';
          el.playLabel.textContent = "PAUSAR";
        } else {
          el.playIcon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>';
          el.playLabel.textContent = "PLAY";
        }

        const effectiveVol = state.muted ? 0 : state.volume;
        el.volSlider.value = effectiveVol;
        el.volPct.textContent = effectiveVol + "%";
        el.btnMute.classList.toggle("muted", state.muted || effectiveVol === 0);

        if (state.muted || effectiveVol === 0) {
          el.volIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
        } else {
          el.volIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>';
        }
      }

      // Aplica volume no player ativo (MP4 ou YouTube)
      function applyVolumeToPlayer() {
        const vol = state.muted ? 0 : state.volume;
        if (state.htmlVideo) {
          state.htmlVideo.muted = state.muted || vol === 0;
          state.htmlVideo.volume = vol / 100;
        }
        if (state.ytPlayer && typeof state.ytPlayer.setVolume === "function") {
          try {
            if (state.muted || vol === 0) {
              state.ytPlayer.mute();
            } else {
              state.ytPlayer.unMute();
              state.ytPlayer.setVolume(vol);
            }
          } catch (e) {}
        }
      }

      // Renderiza o item atual da playlist na tela 2D
      function loadMediaAt(index, withZap = true) {
        if (!state.playlist.length) return;
        const total = state.playlist.length;
        state.pos = ((index % total) + total) % total;
        const item = state.playlist[state.pos];

        destroyCurrentMedia();
        if (withZap) triggerZap2D();

        const media = parseMediaLink(item.url);
        el.tvNowPlaying.textContent = `${item.chTitle}  •  ${item.label}`;
        el.tvBadge.textContent = media.badge;
        if (el.hudInfo) el.hudInfo.textContent = `CANAL: ${item.chTitle}`;
        el.hudCounter.textContent = `${state.pos + 1} / ${total}`;

        // Atualiza URL sem recarregar a página
        try {
          const u = new URL(window.location.href);
          u.searchParams.set("canal", String(item.ci));
          u.searchParams.set("item", String(item.ii));
          window.history.replaceState(null, "", u.toString());
        } catch (e) {}

        highlightDrawerItem();
        state.playing = true;
        syncControlsUI();

        if (media.type === "VIDEO") {
          const vid = document.createElement("video");
          vid.src = media.url;
          vid.controls = true;
          vid.autoplay = true;
          vid.playsInline = true;
          vid.preload = "auto";
          vid.muted = state.muted;
          vid.volume = state.volume / 100;

          vid.addEventListener("play", () => { state.playing = true; syncControlsUI(); resetIdleTimer(); });
          vid.addEventListener("pause", () => { state.playing = false; syncControlsUI(); wakeHUD(); });
          vid.addEventListener("ended", () => loadMediaAt(state.pos + 1, true));

          el.viewport.appendChild(vid);
          state.htmlVideo = vid;

          const p = vid.play();
          if (p && p.catch) {
            p.catch(() => {
              // Se o navegador bloquear áudio automático no primeiro carregamento, inicia mudo e libera no próximo toque
              state.muted = true;
              vid.muted = true;
              syncControlsUI();
              vid.play().catch(() => {});
            });
          }
          return;
        }

        if (media.type === "YOUTUBE" && media.ytId) {
          const mount = document.createElement("div");
          mount.className = "yt-box";
          el.viewport.appendChild(mount);

          const loadToken = state.pos;
          ensureYTApi().then((YT) => {
            if (state.pos !== loadToken) return;
            const vars = {
              autoplay: 1,
              mute: state.muted ? 1 : 0,
              controls: 1,
              rel: 0,
              playsinline: 1,
              modestbranding: 1
            };
            if (String(location.protocol).startsWith("http")) vars.origin = location.origin;

            state.ytPlayer = new YT.Player(mount, {
              host: "https://www.youtube-nocookie.com",
              videoId: media.ytId,
              width: "100%",
              height: "100%",
              playerVars: vars,
              events: {
                onReady: (ev) => {
                  if (state.pos !== loadToken) return;
                  applyVolumeToPlayer();
                  ev.target.playVideo();
                  setTimeout(() => {
                    if (state.pos !== loadToken || !state.ytPlayer) return;
                    try {
                      const st = ev.target.getPlayerState();
                      if (st === -1 || st === 2 || st === 5) {
                        state.muted = true;
                        ev.target.mute();
                        ev.target.playVideo();
                        syncControlsUI();
                      }
                    } catch (e) {}
                  }, 1500);
                },
                onStateChange: (ev) => {
                  if (ev.data === 1) { state.playing = true; syncControlsUI(); resetIdleTimer(); }
                  else if (ev.data === 2) { state.playing = false; syncControlsUI(); wakeHUD(); }
                  else if (ev.data === 0) { loadMediaAt(state.pos + 1, true); }
                }
              }
            });
          });
          return;
        }

        if (media.type === "IMAGE") {
          const img = document.createElement("img");
          img.src = media.url;
          img.alt = item.label;
          el.viewport.appendChild(img);
          return;
        }

        // Google Drive (/preview) ou Web Embed
        const ifr = document.createElement("iframe");
        ifr.src = media.url;
        ifr.title = item.label;
        ifr.allow = "autoplay; fullscreen; encrypted-media";
        ifr.allowFullscreen = true;
        el.viewport.appendChild(ifr);
      }

      // Controles: Play / Pause, Avança, Retorna, Volume
      function togglePlay() {
        playHoloBeep("click");
        if (state.htmlVideo) {
          if (state.htmlVideo.paused) state.htmlVideo.play().catch(() => {});
          else state.htmlVideo.pause();
          return;
        }
        if (state.ytPlayer && typeof state.ytPlayer.getPlayerState === "function") {
          try {
            const st = state.ytPlayer.getPlayerState();
            if (st === 1) state.ytPlayer.pauseVideo();
            else state.ytPlayer.playVideo();
          } catch (e) {}
          return;
        }
        state.playing = !state.playing;
        syncControlsUI();
      }

      function nextMovie() {
        playHoloBeep("swap");
        loadMediaAt(state.pos + 1, true);
      }

      function prevMovie() {
        playHoloBeep("swap");
        loadMediaAt(state.pos - 1, true);
      }

      function toggleMute() {
        playHoloBeep("click");
        state.muted = !state.muted;
        if (!state.muted && state.volume === 0) state.volume = 70;
        applyVolumeToPlayer();
        syncControlsUI();
      }

      function changeVolume(val) {
        state.volume = Math.max(0, Math.min(100, Number(val)));
        state.muted = state.volume === 0;
        applyVolumeToPlayer();
        syncControlsUI();
      }

      // Gaveta de Filmes
      function buildDrawer() {
        el.drawerTotal.textContent = `${state.playlist.length} TÍTULO(S) DISPONÍVEIS`;
        const frag = document.createDocumentFragment();
        let flatIdx = 0;

        state.channels.forEach((ch) => {
          const group = document.createElement("div");
          const title = document.createElement("div");
          title.className = "ch-group-title font-hud";
          title.innerHTML = `<span>${ch.title || "CANAL"}</span><span class="font-mono" style="font-size:10px;color:#67e8f9;">${(ch.videos || []).length}</span>`;
          group.appendChild(title);

          (ch.videos || []).forEach((v) => {
            const idx = flatIdx++;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "movie-item";
            btn.dataset.idx = String(idx);
            btn.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${v.label || "Filme " + (idx + 1)}</span><span class="font-mono" style="font-size:10px;opacity:0.75;">▶</span>`;
            btn.addEventListener("click", () => {
              closeDrawer();
              playHoloBeep("swap");
              loadMediaAt(idx, true);
            });
            group.appendChild(btn);
          });

          frag.appendChild(group);
        });

        el.drawerBody.innerHTML = "";
        el.drawerBody.appendChild(frag);
        highlightDrawerItem();
      }

      function highlightDrawerItem() {
        const items = el.drawerBody.querySelectorAll(".movie-item");
        items.forEach((btn) => {
          btn.classList.toggle("active", Number(btn.dataset.idx) === state.pos);
        });
      }

      function openDrawer() {
        playHoloBeep("click");
        wakeHUD();
        el.drawerBackdrop.classList.add("open");
        el.drawer.classList.add("open");
      }
      function closeDrawer() {
        el.drawerBackdrop.classList.remove("open");
        el.drawer.classList.remove("open");
      }

      // Auto-hide do HUD durante reprodução para cinema puro
      function wakeHUD() {
        document.body.classList.remove("cinema-idle");
        resetIdleTimer();
      }
      function resetIdleTimer() {
        clearTimeout(state.idleTimer);
        if (!state.playing || el.drawer.classList.contains("open")) return;
        state.idleTimer = setTimeout(() => {
          if (state.playing && !el.drawer.classList.contains("open")) {
            document.body.classList.add("cinema-idle");
          }
        }, 3800);
      }

      // Eventos de Botões e Teclado
      el.btnPrev.addEventListener("click", prevMovie);
      el.btnPlay.addEventListener("click", togglePlay);
      el.btnNext.addEventListener("click", nextMovie);
      el.btnMute.addEventListener("click", toggleMute);
      el.volSlider.addEventListener("input", (e) => changeVolume(e.target.value));
      el.btnOpenDrawer.addEventListener("click", openDrawer);
      el.btnCloseDrawer.addEventListener("click", closeDrawer);
      el.drawerBackdrop.addEventListener("click", closeDrawer);

      const ZOOM_LABELS = ["⤢ TELA: PADRÃO", "⤢ TELA: +50%", "⤢ TELA: CINEMA 90%"];
      function cycleZoom() {
        playHoloBeep("click");
        state.zoomLevel = (state.zoomLevel + 1) % 3;
        el.tvFrame.classList.remove("zoom-1", "zoom-2");
        if (state.zoomLevel === 1) el.tvFrame.classList.add("zoom-1");
        else if (state.zoomLevel === 2) el.tvFrame.classList.add("zoom-2");
        el.btnZoom.textContent = ZOOM_LABELS[state.zoomLevel];
      }
      el.btnZoom.addEventListener("click", cycleZoom);

      el.btnFullscreen.addEventListener("click", () => {
        playHoloBeep("click");
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      ["mousemove", "pointerdown", "touchstart"].forEach((evt) => {
        window.addEventListener(evt, wakeHUD, { passive: true });
      });

      window.addEventListener("keydown", (e) => {
        wakeHUD();
        if (e.code === "Space") { e.preventDefault(); togglePlay(); }
        else if (e.code === "ArrowRight") { e.preventDefault(); nextMovie(); }
        else if (e.code === "ArrowLeft") { e.preventDefault(); prevMovie(); }
        else if (e.key === "m" || e.key === "M") { toggleMute(); }
        else if (e.key === "z" || e.key === "Z") { cycleZoom(); }
        else if (e.key === "f" || e.key === "F") { el.btnFullscreen.click(); }
        else if (e.key === "Escape") { closeDrawer(); }
      });

      // Carregamento inicial dos canais (canais.json)
      async function boot() {
        let chs = null;
        for (let i = 0; i < 3; i++) {
          try {
            const res = await fetch(DATA_URL + "canais.json?v=" + Date.now(), { cache: "no-store" });
            if (res.ok) {
              const json = await res.json();
              if (Array.isArray(json) && json.length) {
                chs = json.filter((c) => c && c.id && !String(c.id).startsWith("CAT_"));
                break;
              }
            }
          } catch (e) {}
          await new Promise((r) => setTimeout(r, 600));
        }

        if (!chs || !chs.length) {
          chs = FALLBACK_CHANNELS;
          el.introStatus.textContent = "MODO LOCAL // SESSÃO DEMONSTRAÇÃO";
        }

        state.channels = chs;
        state.playlist = [];
        chs.forEach((c, ci) => {
          (c.videos || []).forEach((v, ii) => {
            if (v && v.url) {
              state.playlist.push({
                ci,
                ii,
                chTitle: c.title || `Canal ${ci + 1}`,
                label: v.label || `Filme ${ii + 1}`,
                url: v.url
              });
            }
          });
        });

        // Verifica se há ?canal=X&item=Y na URL
        let startIndex = 0;
        try {
          const p = new URLSearchParams(window.location.search);
          const cParam = parseInt(p.get("canal"), 10);
          const iParam = parseInt(p.get("item"), 10);
          if (!Number.isNaN(cParam)) {
            const found = state.playlist.findIndex((x) => x.ci === cParam && (Number.isNaN(iParam) || x.ii === iParam));
            if (found >= 0) startIndex = found;
          }
        } catch (e) {}

        try {
          buildDrawer();
          loadMediaAt(startIndex, false);
        } catch (err) {
          console.error("[CINEMA 2D]", err);
        }

        setTimeout(() => {
          if (el.intro) {
            el.intro.classList.add("is-hidden");
            setTimeout(() => { if (el.intro) el.intro.remove(); }, 450);
          }
          resetIdleTimer();
        }, 650);
      }

      boot();
    })();
  </script>
</body>
</html>
